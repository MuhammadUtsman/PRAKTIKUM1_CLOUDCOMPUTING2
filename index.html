<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum Cloud Computing - Modul 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #0ea5e9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1f2937;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .subtitle { color: #6b7280; margin-bottom: 28px; }
    .info {
      text-align: left;
      background: #f9fafb;
      border-radius: 12px;
      padding: 16px 20px;
      line-height: 1.9;
    }
    .info span { font-weight: 600; display: inline-block; width: 110px; }
    footer { margin-top: 24px; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Praktikum Komputasi Awan &middot; Modul 1</div>
    <h1>Server On Cloud</h1>
    <p class="subtitle">Website statis ini di-deploy dari GitHub ke Vercel.</p>

    <div class="info">
      <div><span>Nama</span>: Muhammad Utsman</div>
      <div><span>NIM</span>: 102042430029</div>
      <div><span>Program Studi</span>: Sistem Informasi</div>
      <div><span>Kampus</span>: Telkom University Jakarta</div>
    </div>

    <footer>&copy; 2026 Muhammad Utsman</footer>
  </div>
</body>
</html>
